name: Update scores and deploy

on:
  schedule:
    # Every 30 minutes from 10am to 4am ET (14:00-08:00 UTC). GitHub delays scheduled runs
    # when it's busy, so asking often keeps real updates a few hours apart at worst.
    - cron: "5,35 0-8,14-23 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Always start from the latest main, not the commit that triggered the run, so a queued
      # run can't collide with data an earlier run already pushed.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch games, scores and odds
        run: python scripts/update.py

      - name: Project end-of-season standings
        run: python scripts/project.py

      - name: Commit data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update games data"
            if ! git push; then
              # Someone pushed in between: start over from their commit and refetch.
              git fetch origin main
              git reset --hard origin/main
              python scripts/update.py
              python scripts/project.py
              git add data/
              git diff --cached --quiet || git commit -m "Update games data"
              git push
            fi
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
