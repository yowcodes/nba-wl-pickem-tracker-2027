<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>W/L Pickem Tracker</title>
<meta name="description" content="Live standings, ledgers, daily game stakes and streaks for the W/L Pickem NBA league, 2026-27.">
<meta property="og:type" content="website">
<meta property="og:title" content="W/L Pickem Tracker">
<meta property="og:description" content="Live standings, ledgers, daily game stakes and streaks for the W/L Pickem NBA league, 2026-27.">
<meta name="theme-color" content="#0E131B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#0E131B; --surface:#161D29; --surface2:#1F2837; --fg:#E8EDF5; --muted:#93A0B5; --line:#2A3547;
  --accent:#FB923C; --accent-ink:#1A0E05;
  --win:#5EEAD4; --win-t:#12332F; --loss:#FDA4AF; --loss-t:#3A1A1D;
  --display:"Big Shoulders Display","Arial Narrow",sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:13px;line-height:1.35;
  padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.wrap{max-width:900px;margin:0 auto;padding:0 max(12px,env(safe-area-inset-right,0px)) 32px max(12px,env(safe-area-inset-left,0px))}

header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:10px 0 6px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.02em;margin:0}
.brand span{color:var(--accent)}
.upd{font-size:11px;color:var(--muted);white-space:nowrap}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button,nav a{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:8px 5px;color:var(--muted);
  font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;text-decoration:none}
nav button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}

main{padding-top:12px}
section[hidden]{display:none}
h2{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:18px;letter-spacing:.02em;margin:18px 0 8px}
h2:first-child{margin-top:4px}
.sub{color:var(--muted);font-size:11px;margin:-4px 0 8px}

.tbl{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.tbl th{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child,.tbl .l{text-align:left}
.tbl tr.me td{background:rgba(251,146,60,.07)}
.tbl .rk{color:var(--muted);width:18px}
.tbl .nm{font-weight:700}
.tbl .big{font-family:var(--display);font-weight:800;font-size:17px;line-height:1}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

.side{display:inline-block;font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.02em;border-radius:4px;padding:0 5px;line-height:1.45}
.side.W{background:var(--win-t);color:var(--win)}
.side.L{background:var(--loss-t);color:var(--loss)}
.side.none{background:var(--surface2);color:var(--muted)}
.pos{color:var(--win)} .neg{color:var(--loss)} .mut{color:var(--muted)}
.dots{display:inline-flex;gap:2px;vertical-align:middle}
.dots i{width:7px;height:7px;border-radius:2px;background:var(--surface2)}
.dots i.y{background:var(--win)} .dots i.n{background:var(--loss)}

.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px}
.kpi b{display:block;font-family:var(--display);font-weight:800;font-size:22px;line-height:1}
.kpi span{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

/* games */
.daynav{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.daynav button{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:36px;height:34px;cursor:pointer;font-weight:700}
.daynav input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;height:34px;padding:0 8px;color-scheme:dark}
.game{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.match{font-family:var(--display);font-weight:800;font-size:17px;text-transform:uppercase}
.match .w{color:var(--fg)} .match .lose{color:var(--muted)}
.gmeta{font-size:11px;color:var(--muted);text-align:right}
.out{display:grid;grid-template-columns:76px 1fr;gap:6px;align-items:center;padding:3px 0;font-size:12px}
.out .lab{font-size:11px;color:var(--muted)}
.out .lab b{color:var(--fg)}
.out.hit .lab b{color:var(--win)}
.out.miss{opacity:.45}
.who{display:flex;flex-wrap:wrap;gap:4px}
.who span{background:var(--surface2);border-radius:4px;padding:1px 6px;font-weight:600}
.who span.me{background:var(--accent);color:var(--accent-ink)}
.prob{height:4px;border-radius:2px;background:var(--loss-t);overflow:hidden;margin-top:4px}
.prob i{display:block;height:100%;background:var(--win)}
.note{font-size:11px;color:var(--muted);margin:6px 0 0}
.empty{color:var(--muted);padding:20px 0;text-align:center}
footer{margin-top:24px;font-size:11px;color:var(--muted)}
@media (max-width:420px){.kpis{grid-template-columns:repeat(2,1fr)} .hide-sm{display:none}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1 class="brand">W/L <span>Pickem</span> 2026–27</h1>
      <span class="upd" id="upd"></span>
    </div>
    <nav role="tablist">
      <button role="tab" data-tab="standings">Standings</button>
      <button role="tab" data-tab="ledger">Ledger</button>
      <button role="tab" data-tab="games">Games</button>
      <button role="tab" data-tab="streaks">Streaks</button>
      <a href="how-it-works.html">Rules</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section id="standings"></section>
  <section id="ledger" hidden></section>
  <section id="games" hidden></section>
  <section id="streaks" hidden></section>
  <footer>Scores and odds from ESPN's public scoreboard, refreshed hourly. Odds are DraftKings moneylines with the vig removed. The NBA Cup final doesn't count.</footer>
</main>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});};
var ME=null; try{ME=localStorage.getItem("wl-me");}catch(e){}

var S={}; // state built from data

function load(){
  var v="?v="+Date.now();
  return Promise.all([fetch("data/picks.json"+v).then(function(r){return r.json();}),fetch("data/games.json"+v).then(function(r){return r.json();})]);
}

function build(picks,store){
  var owner={}, sides={};
  picks.picks.forEach(function(p){var k=p.team+" "+p.side; owner[k]=p.drafter; sides[k]={key:k,team:p.team,side:p.side,drafter:p.drafter,pick:p.pick,log:[]};});
  var games=Object.keys(store.games).map(function(k){return store.games[k];});
  games.sort(function(a,b){return a.start<b.start?-1:a.start>b.start?1:0;});
  var teams={};
  function team(t){return teams[t]||(teams[t]={w:0,l:0});}
  var finals=games.filter(function(g){return g.final;});
  finals.forEach(function(g){
    var win=g.winner, lose=g.winner===g.home?g.away:g.home;
    team(win).w++; team(lose).l++;
    var res=[[win+" W",1,lose],[win+" L",0,lose],[lose+" W",0,win],[lose+" L",1,win]];
    res.forEach(function(r){
      var s=sides[r[0]]; if(!s) return;
      s.log.push({date:g.date,game:g,got:r[1],opp:r[2]});
    });
  });
  var drafters=picks.drafters.map(function(n){return {name:n,sides:[],pts:0,poss:0,pace:0};});
  var byName={}; drafters.forEach(function(d){byName[d.name]=d;});
  Object.keys(sides).forEach(function(k){var s=sides[k]; byName[s.drafter].sides.push(s);});
  drafters.forEach(function(d){
    d.sides.sort(function(a,b){return a.pick-b.pick;});
    d.sides.forEach(function(s){
      s.pts=s.log.reduce(function(a,x){return a+x.got;},0); s.gp=s.log.length;
      s.pace=s.gp?s.pts/s.gp*82:41;
      d.pts+=s.pts; d.poss+=s.gp; d.pace+=s.pace;
    });
  });
  var lastDate=finals.length?finals[finals.length-1].date:null;
  drafters.forEach(function(d){d.last=0; d.sides.forEach(function(s){s.log.forEach(function(x){if(x.date===lastDate) d.last+=x.got;});});});
  drafters.sort(function(a,b){return b.pts-a.pts||b.pace-a.pace;});
  S={picks:picks,store:store,owner:owner,sides:sides,games:games,finals:finals,teams:teams,drafters:drafters,byName:byName,lastDate:lastDate};
}

function rec(t){var r=S.teams[t]||{w:0,l:0}; return r.w+"–"+r.l;}
function sideTag(k){var p=k.split(" "); return '<span class="side '+p[1]+'">'+p[0]+" "+p[1]+"</span>";}
function pct(a,b){return b?Math.round(a/b*100)+"%":"–";}
function dots(log,n){var x=log.slice(-n); var h=""; for(var i=0;i<n-x.length;i++) h+="<i></i>"; x.forEach(function(e){h+='<i class="'+(e.got?"y":"n")+'"></i>';}); return '<span class="dots">'+h+"</span>";}
function fmtDate(iso,opt){var p=iso.split("-"); return new Date(+p[0],p[1]-1,+p[2]).toLocaleDateString("en-US",opt||{weekday:"short",month:"short",day:"numeric"});}
function etTime(z){return new Date(z).toLocaleTimeString("en-US",{timeZone:"America/New_York",hour:"numeric",minute:"2-digit"}).replace(":00","").replace(" ","").toLowerCase();}
function todayET(){return new Date().toLocaleDateString("en-CA",{timeZone:"America/New_York"});}
function meCls(n){return n===ME?" me":"";}

/* ---------- standings ---------- */
function renderStandings(){
  var rows=S.drafters.map(function(d,i){
    return '<tr class="'+meCls(d.name).trim()+'"><td class="rk">'+(i+1)+'</td><td class="l nm">'+esc(d.name)+'</td><td class="big">'+d.pts+
      '</td><td>'+d.pts+"–"+(d.poss-d.pts)+'</td><td>'+pct(d.pts,d.poss)+'</td><td class="'+(d.last?"pos":"mut")+'">+'+d.last+
      '</td><td class="hide-sm">'+Math.round(d.pace)+"</td></tr>";
  }).join("");
  var grid=S.drafters.map(function(d){
    return '<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><b>'+esc(d.name)+'</b><span class="mut">'+d.pts+' pts</span></div><div class="who">'+
      d.sides.map(function(s){return '<span>'+sideTag(s.key)+' <span class="mut" style="background:none;padding:0">'+rec(s.team)+' · '+s.pts+'</span></span>';}).join("")+"</div></div>";
  }).join("");
  $("standings").innerHTML='<h2>Leaderboard</h2><p class="sub">Points so far. Record counts every game one of your sides played (a point earned or not). Pace projects each side to 82 games.</p>'+
    '<div class="scroll"><table class="tbl"><thead><tr><th></th><th>Drafter</th><th>Pts</th><th>Rec</th><th>Hit</th><th>'+(S.lastDate?fmtDate(S.lastDate,{month:"numeric",day:"numeric"}):"Last")+'</th><th class="hide-sm">Pace</th></tr></thead><tbody>'+rows+"</tbody></table></div>"+
    '<h2>Picks</h2><p class="sub">Each side with its team record and points earned.</p>'+grid+undrafted();
}
function undrafted(){
  var all=[], teamsAll={}; S.games.forEach(function(g){teamsAll[g.home]=1;teamsAll[g.away]=1;});
  Object.keys(teamsAll).sort().forEach(function(t){["W","L"].forEach(function(sd){if(!S.owner[t+" "+sd]) all.push(t+" "+sd);});});
  if(!all.length) return "";
  return '<p class="note">Undrafted (nobody scores): '+all.map(sideTag).join(" ")+"</p>";
}

/* ---------- ledger ---------- */
var ledgerWho=null;
function renderLedger(){
  if(!ledgerWho) ledgerWho=ME&&S.byName[ME]?ME:S.drafters[0].name;
  var d=S.byName[ledgerWho];
  var chips=S.picks.drafters.map(function(n){return '<button class="chip" aria-pressed="'+(n===ledgerWho)+'" data-who="'+esc(n)+'">'+esc(n)+"</button>";}).join("");
  var rank=S.drafters.indexOf(d)+1;
  var kp='<div class="kpis"><div class="kpi"><b>'+d.pts+'</b><span>Points · #'+rank+'</span></div><div class="kpi"><b>'+pct(d.pts,d.poss)+'</b><span>Hit rate</span></div><div class="kpi"><b>'+d.pts+"–"+(d.poss-d.pts)+'</b><span>Record</span></div><div class="kpi"><b>'+Math.round(d.pace)+'</b><span>Pace</span></div></div>';
  var rows=d.sides.map(function(s){
    return '<tr><td class="mut">'+s.pick+'</td><td class="l">'+sideTag(s.key)+'</td><td>'+rec(s.team)+'</td><td class="big">'+s.pts+'</td><td>'+s.gp+'</td><td>'+(s.gp?Math.round(s.pace):"–")+'</td><td>'+dots(s.log,5)+"</td></tr>";
  }).join("");
  var log=[]; d.sides.forEach(function(s){s.log.forEach(function(x){log.push({s:s,x:x});});});
  log.sort(function(a,b){return a.x.game.start<b.x.game.start?1:a.x.game.start>b.x.game.start?-1:0;});
  var byDay={}, order=[]; log.forEach(function(e){if(!byDay[e.x.date]){byDay[e.x.date]=[];order.push(e.x.date);} byDay[e.x.date].push(e);});
  var logHtml=order.map(function(dt){
    var items=byDay[dt], got=items.reduce(function(a,e){return a+e.x.got;},0);
    return '<tr><td class="l" colspan="3" style="color:var(--muted);font-size:11px;padding-top:10px">'+fmtDate(dt)+'</td><td style="padding-top:10px" class="'+(got?"pos":"mut")+'">+'+got+" of "+items.length+"</td></tr>"+
      items.map(function(e){var g=e.x.game; return '<tr><td class="l">'+sideTag(e.s.key)+'</td><td class="l">'+score(g)+'</td><td></td><td class="'+(e.x.got?"pos":"neg")+'">'+(e.x.got?"+1":"0")+"</td></tr>";}).join("");
  }).join("");
  $("ledger").innerHTML='<div class="chips">'+chips+"</div>"+kp+
    '<div class="scroll"><table class="tbl"><thead><tr><th>#</th><th>Side</th><th>Team</th><th>Pts</th><th>GP</th><th>Pace</th><th>Last 5</th></tr></thead><tbody>'+rows+"</tbody></table></div>"+
    '<h2>Game log</h2>'+(order.length?'<div class="scroll"><table class="tbl"><tbody>'+logHtml+"</tbody></table></div>":'<p class="empty">No games yet.</p>')+
    '<p class="note"><label><input type="checkbox" id="mebox" '+(ME===ledgerWho?"checked":"")+'> This is me (highlight '+esc(ledgerWho)+" across the site on this device)</label></p>";
  [].forEach.call($("ledger").querySelectorAll("[data-who]"),function(b){b.onclick=function(){ledgerWho=b.dataset.who; setHash("ledger/"+ledgerWho); renderLedger();};});
  $("mebox").onchange=function(){ME=this.checked?ledgerWho:null; try{ME?localStorage.setItem("wl-me",ME):localStorage.removeItem("wl-me");}catch(e){} renderAll();};
}
function score(g){
  if(g.state==="pre") return g.away+" @ "+g.home;
  var a=g.away+" "+g.awayScore, h=g.home+" "+g.homeScore;
  return g.winner===g.away?"<b>"+a+"</b> @ "+h:a+" @ <b>"+h+"</b>";
}

/* ---------- games ---------- */
var gameDate=null;
function gameDates(){var s={}; S.games.forEach(function(g){s[g.date]=1;}); return Object.keys(s).sort();}
function stakes(g){
  // points each drafter gains if home wins / if away wins
  var hw={}, aw={};
  function add(o,k){var n=S.owner[k]; if(n) o[n]=(o[n]||0)+1;}
  add(hw,g.home+" W"); add(hw,g.away+" L"); add(aw,g.away+" W"); add(aw,g.home+" L");
  return {home:hw,away:aw};
}
function renderGames(){
  var dates=gameDates();
  if(!dates.length){$("games").innerHTML='<p class="empty">No games loaded yet.</p>';return;}
  if(!gameDate||dates.indexOf(gameDate)<0){
    var t=todayET(); gameDate=dates.filter(function(d){return d>=t;})[0]||dates[dates.length-1];
  }
  var i=dates.indexOf(gameDate);
  var day=S.games.filter(function(g){return g.date===gameDate;});
  var names=S.picks.drafters;
  var sum={}; names.forEach(function(n){sum[n]={min:0,max:0,exp:0,act:0,inv:0,noLine:false};});
  var cards=day.map(function(g){
    var st=stakes(g), p=g.odds?g.odds.homeProb:0.5;
    names.forEach(function(n){
      var h=st.home[n]||0, a=st.away[n]||0, s=sum[n];
      if(h||a) s.inv++;
      if(g.final){var v=g.winner===g.home?h:a; s.min+=v; s.max+=v; s.exp+=v; s.act+=v;}
      else{s.min+=Math.min(h,a); s.max+=Math.max(h,a); s.exp+=p*h+(1-p)*a; if((h||a)&&!g.odds) s.noLine=true;}
    });
    function row(team,o,won){
      var who=Object.keys(o).map(function(n){return '<span class="'+meCls(n).trim()+'">'+esc(n)+(o[n]>1?" +"+o[n]:"")+"</span>";}).join("")||'<span class="mut" style="background:none">nobody</span>';
      var cls=g.final?(won?" hit":" miss"):"";
      return '<div class="out'+cls+'"><span class="lab">If <b>'+team+"</b> win</span><div class=\"who\">"+who+"</div></div>";
    }
    var meta;
    if(g.final) meta="Final";
    else if(g.state==="in") meta=esc(g.detail||"Live");
    else meta=etTime(g.start)+" ET";
    var odds=g.odds?'<div class="gmeta">'+g.away+" "+Math.round((1-p)*100)+"% · "+g.home+" "+Math.round(p*100)+'%</div><div class="prob"><i style="width:'+((1-p)*100).toFixed(1)+'%"></i></div>':(g.final?"":'<div class="gmeta">No line yet</div>');
    var m=g.state==="pre"?g.away+" @ "+g.home:
      '<span class="'+(g.winner===g.away||!g.final?"w":"lose")+'">'+g.away+" "+g.awayScore+'</span> @ <span class="'+(g.winner===g.home||!g.final?"w":"lose")+'">'+g.home+" "+g.homeScore+"</span>";
    return '<div class="game"><div class="ghead"><span class="match">'+m+'</span><span class="gmeta">'+meta+"</span></div>"+
      row(g.away,st.away,g.winner===g.away)+row(g.home,st.home,g.winner===g.home)+(g.final?"":odds)+"</div>";
  }).join("");
  var sim=simDay(day,names);
  var allFinal=day.every(function(g){return g.final;});
  var topAct=Math.max.apply(null,names.map(function(n){return sum[n].act;}));
  var rows=names.slice().sort(function(a,b){return sum[b].exp-sum[a].exp;}).map(function(n){
    var s=sum[n], r=sim[n];
    return '<tr class="'+meCls(n).trim()+'"><td class="l nm">'+esc(n)+'</td><td>'+s.inv+'</td><td>'+s.min+"–"+s.max+'</td><td class="big">'+(allFinal?s.act:s.exp.toFixed(1))+(s.noLine&&!allFinal?"*":"")+'</td><td>'+(allFinal?"–":r.lo+"–"+r.hi)+'</td><td>'+(allFinal?(s.act===topAct&&topAct>0?"🏆":"–"):Math.round(r.top*100)+"%")+"</td></tr>";
  }).join("");
  $("games").innerHTML='<div class="daynav"><button id="gprev" '+(i<=0?"disabled":"")+' aria-label="Previous day">‹</button><input type="date" id="gdate" value="'+gameDate+'" min="'+dates[0]+'" max="'+dates[dates.length-1]+'"><button id="gtoday">Today</button><button id="gnext" '+(i>=dates.length-1?"disabled":"")+' aria-label="Next day">›</button></div>'+
    '<h2>'+fmtDate(gameDate,{weekday:"long",month:"long",day:"numeric"})+'</h2>'+
    '<div class="scroll"><table class="tbl"><thead><tr><th>Drafter</th><th>Games</th><th>Min–Max</th><th>'+(allFinal?"Pts":"Exp")+'</th><th>Sim 80%</th><th>Top day</th></tr></thead><tbody>'+rows+"</tbody></table></div>"+
    '<p class="note">Min–Max: worst and best case across the day\'s games. Exp: expected points from the betting odds. Sim 80%: middle 80% of 10,000 simulated nights. Top day: share of simulations where that drafter scores the most (ties split).'+(rows.indexOf("*")>-1?" *A game has no line yet, so it counts as 50/50.":"")+"</p>"+
    '<h2>Games</h2>'+(cards||'<p class="empty">No games.</p>');
  $("gprev").onclick=function(){go(dates[i-1]);};
  $("gnext").onclick=function(){go(dates[i+1]);};
  $("gtoday").onclick=function(){gameDate=null; renderGames(); setHash("games/"+gameDate);};
  $("gdate").onchange=function(){var v=this.value, pick=dates.filter(function(d){return d>=v;})[0]||dates[dates.length-1]; go(pick);};
  function go(d){gameDate=d; setHash("games/"+d); renderGames();}
}
function simDay(day,names){
  var N=10000, idx={}, res={};
  names.forEach(function(n,k){idx[n]=k; res[n]={top:0,vals:[]};});
  var gs=day.map(function(g){var st=stakes(g); return {g:g,p:g.odds?g.odds.homeProb:0.5,h:st.home,a:st.away};});
  var tot=new Array(names.length);
  for(var it=0;it<N;it++){
    for(var k=0;k<tot.length;k++) tot[k]=0;
    gs.forEach(function(x){
      var homeWins=x.g.final?x.g.winner===x.g.home:Math.random()<x.p;
      var o=homeWins?x.h:x.a; for(var n in o) tot[idx[n]]+=o[n];
    });
    var mx=Math.max.apply(null,tot), nTop=0;
    for(k=0;k<tot.length;k++) if(tot[k]===mx) nTop++;
    names.forEach(function(n,k){res[n].vals.push(tot[k]); if(tot[k]===mx) res[n].top+=1/nTop;});
  }
  names.forEach(function(n){
    var v=res[n].vals.sort(function(a,b){return a-b;});
    res[n].lo=v[Math.floor(N*0.1)]; res[n].hi=v[Math.floor(N*0.9)]; res[n].top/=N;
  });
  return res;
}

/* ---------- streaks ---------- */
var win="7";
function renderStreaks(){
  var opts=[["7","7 days"],["15","15 days"],["30","30 days"],["all","Season"]];
  var chips=opts.map(function(o){return '<button class="chip" aria-pressed="'+(o[0]===win)+'" data-win="'+o[0]+'">'+o[1]+"</button>";}).join("");
  var from=null;
  if(win!=="all"&&S.lastDate){var p=S.lastDate.split("-"); var d=new Date(Date.UTC(+p[0],p[1]-1,+p[2]-(+win-1))); from=d.toISOString().slice(0,10); if(S.finals.length&&from<S.finals[0].date) from=S.finals[0].date;}
  function inWin(x){return !from||x.date>=from;}
  var drows=S.picks.drafters.map(function(n){
    var d=S.byName[n], got=0, n0=0;
    d.sides.forEach(function(s){s.log.filter(inWin).forEach(function(x){got+=x.got;n0++;});});
    return {n:n,got:got,poss:n0,rate:n0?got/n0:0};
  }).sort(function(a,b){return b.rate-a.rate||b.got-a.got;});
  var drHtml=drows.map(function(r,i){
    var tag=r.poss>=10&&r.rate>=0.6?" 🔥":r.poss>=10&&r.rate<=0.4?" 🧊":"";
    return '<tr class="'+meCls(r.n).trim()+'"><td class="rk">'+(i+1)+'</td><td class="l nm">'+esc(r.n)+tag+'</td><td>'+r.got+"–"+(r.poss-r.got)+'</td><td class="big">'+pct(r.got,r.poss)+"</td><td>"+r.got+"</td></tr>";
  }).join("");
  var srows=Object.keys(S.sides).map(function(k){
    var s=S.sides[k], lg=s.log.filter(inWin), got=lg.reduce(function(a,x){return a+x.got;},0);
    var cur=0, kind=null; for(var j=s.log.length-1;j>=0;j--){var g=s.log[j].got; if(kind===null) kind=g; if(g!==kind) break; cur++;}
    return {s:s,got:got,poss:lg.length,cur:cur,kind:kind};
  }).sort(function(a,b){return (b.kind?b.cur:-b.cur)-(a.kind?a.cur:-a.cur)||b.got-a.got;});
  var srHtml=srows.map(function(r){
    var st=r.kind===null?'<span class="mut">–</span>':'<span class="'+(r.kind?"pos":"neg")+'">'+(r.kind?"✓":"✗")+r.cur+"</span>";
    return '<tr class="'+meCls(r.s.drafter).trim()+'"><td class="l">'+sideTag(r.s.key)+'</td><td class="l">'+esc(r.s.drafter)+'</td><td>'+st+'</td><td>'+r.got+"–"+(r.poss-r.got)+"</td><td>"+dots(r.s.log,5)+"</td></tr>";
  }).join("");
  $("streaks").innerHTML='<div class="chips">'+chips+"</div>"+
    '<h2>Drafters</h2><p class="sub">'+(from?"Since "+fmtDate(from):"Whole season")+'. Record = points earned vs. missed across all 8 sides. 🔥 60%+ / 🧊 40% or less, once a drafter has 10+ games in the window.</p>'+
    '<div class="scroll"><table class="tbl"><thead><tr><th></th><th>Drafter</th><th>Rec</th><th>Hit</th><th>Pts</th></tr></thead><tbody>'+drHtml+"</tbody></table></div>"+
    '<h2>Sides</h2><p class="sub">Streak = consecutive games scoring (✓) or not scoring (✗), counting back from the latest game. Record is for the selected window.</p>'+
    '<div class="scroll"><table class="tbl"><thead><tr><th>Side</th><th>Owner</th><th>Streak</th><th>Rec</th><th>Last 5</th></tr></thead><tbody>'+srHtml+"</tbody></table></div>";
  [].forEach.call($("streaks").querySelectorAll("[data-win]"),function(b){b.onclick=function(){win=b.dataset.win; setHash("streaks/"+win); renderStreaks();};});
}

/* ---------- routing ---------- */
var TABS=["standings","ledger","games","streaks"];
function setHash(h){history.replaceState(null,"","#"+h);}
function show(tab){
  TABS.forEach(function(t){$(t).hidden=t!==tab;});
  [].forEach.call(document.querySelectorAll("nav [data-tab]"),function(b){b.setAttribute("aria-selected",b.dataset.tab===tab);});
}
function route(){
  var h=decodeURIComponent(location.hash.slice(1)).split("/"), tab=TABS.indexOf(h[0])>-1?h[0]:"standings";
  if(tab==="ledger"&&h[1]&&S.byName[h[1]]) ledgerWho=h[1];
  if(tab==="games"&&h[1]) gameDate=h[1];
  if(tab==="streaks"&&h[1]) win=h[1];
  renderAll(); show(tab);
}
function renderAll(){renderStandings(); renderLedger(); renderGames(); renderStreaks();}
[].forEach.call(document.querySelectorAll("nav [data-tab]"),function(b){b.onclick=function(){setHash(b.dataset.tab); show(b.dataset.tab); window.scrollTo(0,0);};});
window.addEventListener("hashchange",route);

load().then(function(r){
  build(r[0],r[1]);
  var u=new Date(r[1].updated); $("upd").textContent="Updated "+u.toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
  route();
}).catch(function(e){$("standings").innerHTML='<p class="empty">Couldn\'t load league data. Try refreshing.</p>'; console.error(e);});
})();
</script>
